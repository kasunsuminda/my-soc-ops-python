<div id="game-container">
<div class="flex flex-col min-h-full" style="background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0d0221 100%);">
    <!-- Header with cyberpunk style -->
    <header class="flex items-center justify-between p-4" style="background: linear-gradient(90deg, rgba(0, 255, 255, 0.1) 0%, rgba(255, 0, 255, 0.05) 100%); border-bottom: 2px solid #00ffff; box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-sm px-3 py-1.5 rounded transition-all" style="color: #00ffff; border: 1px solid #00ffff; background: transparent; cursor: pointer; font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); hover: box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);">
            ← Back
        </button>
        <h1 style="font-size: 1.5rem; font-weight: 900; margin: 0; color: #00ffff; text-shadow: 0 0 15px rgba(0, 255, 255, 0.9), 0 0 30px rgba(255, 0, 255, 0.5); letter-spacing: 2px;">⚡ CARD DECK ⚡</h1>
        <div class="w-16"></div>
    </header>

    <!-- Main card display area -->
    <div class="flex-1 flex items-center justify-center p-6" style="background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d0221 100%); perspective: 1000px;">
        <div style="max-width: 400px; width: 100%;">
            <!-- The card itself with 3D perspective -->
            <div style="position: relative; width: 100%; aspect-ratio: 3/4;">
                <div style="position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; animation: cardFlip 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55), shadowPulse 0.7s ease-out; transform-style: preserve-3d; transform: perspective(1000px); background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d0221 100%); border: 2px solid #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(255, 0, 255, 0.1), 0 0 60px rgba(255, 0, 255, 0.4);">
                    <!-- Card number/ID -->
                    <div style="position: absolute; top: 1.5rem; left: 1.5rem;">
                        <p style="color: #00ffff; font-size: 0.9rem; margin: 0; font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);">CARD {{ session.current_card.id + 1 }}</p>
                    </div>

                    <!-- Main question text -->
                    <p style="color: #00ffff; font-size: 1.5rem; font-weight: bold; line-height: 1.4; margin: 0; text-shadow: 0 0 15px rgba(0, 255, 255, 0.9), 0 0 30px rgba(255, 0, 255, 0.5);">
                        {{ session.current_card.text }}
                    </p>

                    <!-- Decorative corner elements -->
                    <div style="position: absolute; top: 0.5rem; right: 0.5rem; width: 20px; height: 20px; border-top: 2px solid #ff00ff; border-right: 2px solid #ff00ff; box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);"></div>
                    <div style="position: absolute; bottom: 0.5rem; left: 0.5rem; width: 20px; height: 20px; border-bottom: 2px solid #00ffff; border-left: 2px solid #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);"></div>
                </div>
            </div>

            <!-- Next button -->
            <div style="margin-top: 2rem; text-align: center;">
                <button
                    hx-post="/card/next"
                    hx-target="#game-container"
                    hx-swap="outerHTML"
                    style="width: 100%; max-width: 300px; padding: 1rem 2rem; font-size: 1.125rem; background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(255, 0, 255, 0.2) 100%); border: 2px solid #00ffff; color: #00ffff; font-weight: bold; border-radius: 4px; cursor: pointer; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.1); transition: all 0.3s ease; letter-spacing: 1px;"
                    onmouseover="this.style.boxShadow='0 0 30px rgba(0, 255, 255, 0.8), inset 0 0 20px rgba(0, 255, 255, 0.2), 0 0 50px rgba(255, 0, 255, 0.4)'; this.style.textShadow='0 0 20px rgba(0, 255, 255, 1), 0 0 40px rgba(255, 0, 255, 0.8)';"
                    onmouseout="this.style.boxShadow='0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.1)'; this.style.textShadow='0 0 10px rgba(0, 255, 255, 0.8)';">
                    ⚡ NEXT CARD ⚡
                </button>
            </div>
        </div>
    </div>
</div>
</div>

<style>
@keyframes cardFlip {
    0% {
        opacity: 0;
        transform: rotateY(-180deg) rotateX(15deg);
        box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(255, 0, 255, 0.05);
    }
    50% {
        transform: rotateY(-90deg) rotateX(8deg);
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(255, 0, 255, 0.15);
    }
    100% {
        opacity: 1;
        transform: rotateY(0deg) rotateX(0deg);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(255, 0, 255, 0.1), 0 0 60px rgba(255, 0, 255, 0.4);
    }
}

@keyframes shadowPulse {
    0% {
        box-shadow: 0 5px 15px rgba(255, 0, 255, 0.2), 0 0 10px rgba(0, 255, 255, 0.3);
    }
    50% {
        box-shadow: 0 25px 70px rgba(255, 0, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.8);
    }
    100% {
        box-shadow: 0 20px 60px rgba(255, 0, 255, 0.4), 0 0 30px rgba(0, 255, 255, 0.6);
    }
}

@keyframes neonFlicker {
    0%, 100% {
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.5);
    }
    50% {
        text-shadow: 0 0 15px rgba(0, 255, 255, 1), 0 0 30px rgba(255, 0, 255, 0.7);
    }
}
</style>
