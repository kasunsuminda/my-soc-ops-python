<div id="game-container">
<div class="flex flex-col min-h-full" style="background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);">
    <!-- Header with chalkboard style -->
    <header class="flex items-center justify-between p-4 chalkboard-header">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="back-button text-sm px-3 py-1.5 rounded transition-all">
            ← Back
        </button>
        <h1 class="font-bold chalk-text" style="font-size: 1.5rem;">Soc Ops</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions with chalk style -->
    <p class="text-center chalk-subtitle text-sm py-3 px-4" style="color: #ffd54f;">
        📍 Tap a square when you find someone who matches it
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div style="background: linear-gradient(135deg, #fde68a 0%, #fcd34d 100%); color: #333; text-align: center; padding: 1rem; font-weight: bold; font-size: 1.25rem; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
        🎉🎊 BINGO! You got a line! 🎊🎉
    </div>
    {% endif %}

    <!-- Board container -->
    <div class="flex-1 flex items-center justify-center p-4">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
