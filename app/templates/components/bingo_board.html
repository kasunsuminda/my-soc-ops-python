<div class="bingo-grid grid grid-cols-5 gap-1 max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="bingo-square relative flex items-center justify-center p-1 text-center select-none text-xs leading-tight
        {%- if square.is_marked %}
            {%- if is_winning %} winning
            {%- else %} marked
            {%- endif %}
        {%- endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto" style="font-weight: 500;">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="sticker-mark absolute top-0.5 right-0.5" style="font-size: 1.25rem;"></span>
        {% endif %}
    </button>
    {% endfor %}
</div>
